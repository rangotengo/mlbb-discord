<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; frame-src http://localhost:* http://127.0.0.1:*; ">
  <title>Dot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="config-screen" class="screen">
      <header>
        <div>
          <p class="eyebrow">Dot</p>
          <h1>Set up the bot</h1>
        </div>
        <button type="button" id="back-from-config-btn" class="btn-quiet hidden">Back</button>
      </header>
      <form id="config-form" autocomplete="off" onsubmit="return false;">
        <section class="field-group">
          <h2>Discord</h2>
          <label for="discord-token">Bot token</label>
          <input type="password" id="discord-token" required>
        </section>

        <section class="field-group">
          <h2>Challonge</h2>
          <label for="challonge-username">Username</label>
          <input type="text" id="challonge-username" required>
          <label for="challonge-token">API key</label>
          <input type="password" id="challonge-token" required>
        </section>

        <section class="field-group">
          <h2>Bot</h2>
          <div class="field-row">
            <div>
              <label for="bot-prefix">Command prefix</label>
              <input type="text" id="bot-prefix" value="!" required>
            </div>
            <div>
              <label for="bot-to-role">Organiser role</label>
              <input type="text" id="bot-to-role" value="Organizer" required>
            </div>
          </div>
          <label for="web-password">Admin password</label>
          <input type="text" id="web-password" placeholder="Leave empty for no password">
          <p class="hint">Used when someone opens the admin panel from another machine.</p>
        </section>

        <div class="buttons">
          <button type="submit" class="btn-primary">Save and start</button>
          <button type="button" id="load-config" class="btn-quiet">Reload saved config</button>
        </div>
      </form>
    </div>

    <div id="dashboard-screen" class="screen hidden">
      <header>
        <div>
          <p class="eyebrow">Dot</p>
          <h1>Bot</h1>
        </div>
        <div class="status-indicator">
          <span id="status-dot"></span>
          <span id="status-text">Stopped</span>
          <button type="button" id="settings-btn" class="btn-quiet" title="Settings">Settings</button>
          <button type="button" id="start-btn" class="btn-quiet hidden" title="Start bot">Start</button>
          <button type="button" id="stop-btn" class="btn-quiet" title="Stop bot">Stop</button>
        </div>
      </header>

      <section id="network-info">
        <h2>Admin panel</h2>
        <div class="url-row">
          <span>This machine</span>
          <code id="local-url">http://localhost:3000</code>
          <button type="button" class="copy-btn" data-target="local-url">Copy</button>
        </div>
        <div class="url-row">
          <span>Network</span>
          <code id="network-url">Detecting…</code>
          <button type="button" class="copy-btn" data-target="network-url">Copy</button>
        </div>
        <p class="hint">Anyone on the same network can use the network address.</p>
      </section>

      <section id="logs">
        <h2>Logs <label class="hint"><input type="checkbox" id="auto-scroll" checked> Follow</label></h2>
        <div id="log-container"></div>
      </section>

      <div class="buttons">
        <button type="button" id="web-interface-btn" class="btn-primary">Open admin</button>
        <button type="button" id="export-logs-btn" class="btn-quiet">Export logs</button>
      </div>
    </div>

    <div id="web-interface-screen" class="screen hidden web-screen">
      <header>
        <h1>Admin</h1>
        <button type="button" id="back-to-dashboard-btn" class="btn-quiet">Back</button>
      </header>
      <iframe id="web-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups" title="Tournament admin"></iframe>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>

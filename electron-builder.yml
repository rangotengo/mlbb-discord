appId: com.mlbb.tournament-bot
productName: MLBB Tournament Bot
executableName: mlbb-tournament-bot
directories:
  output: dist/installers
  buildResources: assets
files:
  - dist/electron/**/*
  - dist/**/*
  - "!dist/installers/**"
  - ui/**/*
# Do not publish or sign from this file. Signing credentials are not configured.
publish: null
forceCodeSigning: false
extraResources:
  - from: node_modules/call-bind-apply-helpers
    to: node_modules/call-bind-apply-helpers
  - from: node_modules/function-bind
    to: node_modules/function-bind
  - from: node_modules/es-errors
    to: node_modules/es-errors
npmRebuild: false
includeSubNodeModules: true
asar: false
win:
  target: nsis
  icon: assets/icon.ico
  # No certificate is configured. electron-builder must not claim a signed executable.
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
mac:
  target: dmg
  icon: assets/icon.icns
  # null skips codesign. Hardened runtime and notarisation need a Developer ID, which is not available here.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
dmg:
  artifactName: ${productName}-${version}.${ext}
